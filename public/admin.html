<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Admin Control</title>

    <link
        rel="stylesheet"
        href="/styles.css">

</head>

<body>

    <div id="layout">

        <!-- ============================
             HEX MAP
        ============================ -->

        <div id="mapContainer">

            <div id="gameBoard"></div>

        </div>


        <!-- ============================
             MAP TOOLS
        ============================ -->

        <div id="mapToolsStrip">

            <button
                id="zoomIn"
                class="mapToolBtn">
                Zoom +
            </button>

            <button
                id="zoomOut"
                class="mapToolBtn">
                Zoom −
            </button>

            <button
                id="zoomUnits"
                class="mapToolBtn">
                Zoom to Units
            </button>

        </div>


        <!-- ============================
             UNIT PANEL
        ============================ -->

        <div id="unitPanel">

            <div class="sidePanelHeader">

                <span id="unitPanelTitle">
                    Units
                </span>

                <button
                    id="closeUnitPanel"
                    class="closePanelBtn">
                    ×
                </button>

            </div>

            <div id="unitList"></div>

        </div>


        <!-- ============================
             ARMAMENTS PANEL
        ============================ -->

        <div id="armamentsPanel">

            <div class="sidePanelHeader">

                <span id="armamentsPanelTitle">
                    Armaments
                </span>

                <button
                    id="closeArmamentsPanel"
                    class="closePanelBtn">
                    ×
                </button>

            </div>

            <div id="armamentsList">

                <div class="armamentCategory">

                    <div class="armamentCategoryTitle">
                        Air
                    </div>

                    <div class="armamentItem">

                        <div class="armamentName">
                            Air-to-Air Missiles
                        </div>

                        <div class="armamentDescription">
                            Weapons carried by fighter aircraft.
                        </div>

                    </div>

                    <div class="armamentItem">

                        <div class="armamentName">
                            Air-to-Ground Weapons
                        </div>

                        <div class="armamentDescription">
                            Weapons used against ground targets.
                        </div>

                    </div>

                </div>


                <div class="armamentCategory">

                    <div class="armamentCategoryTitle">
                        Naval
                    </div>

                    <div class="armamentItem">

                        <div class="armamentName">
                            Anti-Ship Missiles
                        </div>

                        <div class="armamentDescription">
                            Weapons used against naval targets.
                        </div>

                    </div>

                </div>


                <div class="armamentCategory">

                    <div class="armamentCategoryTitle">
                        Ground
                    </div>

                    <div class="armamentItem">

                        <div class="armamentName">
                            Ground-Based Weapons
                        </div>

                        <div class="armamentDescription">
                            Weapons available to ground forces.
                        </div>

                    </div>

                </div>

            </div>

        </div>


        <!-- ============================
             FOB PANEL
        ============================ -->

        <div id="fobPanel">

            <div class="sidePanelHeader">

                <span id="fobPanelTitle">
                    FOB
                </span>

                <button
                    id="closeFobPanel"
                    class="closePanelBtn">
                    ×
                </button>

            </div>

            <div id="fobList"></div>

        </div>


        <!-- ============================
             HEX UNIT SELECTION PANEL
        ============================ -->

        <div id="hexUnitPanel">

            <div class="sidePanelHeader">

                <span id="hexUnitPanelTitle">
                    Units
                </span>

                <button
                    id="closeHexUnitPanel"
                    class="closePanelBtn">
                    ×
                </button>

            </div>

            <div id="hexUnitList"></div>

        </div>

    </div>


    <!-- ============================
         BOTTOM MENU
    ============================ -->

    <div id="bottomMenu">

        <button
            id="backButton"
            class="menuBtn">
            Back
        </button>

        <button
            id="logBook"
            class="menuBtn">
            Log Book
        </button>

        <button
            id="armaments"
            class="menuBtn">
            Armaments
        </button>

        <button
            id="unitsBtn"
            class="menuBtn">
            Units ▸
        </button>

        <button
            id="continueTurn"
            class="menuBtn"
            style="background:#2a7;">
            Continue
        </button>

        <button
            id="resetGame"
            class="menuBtn"
            style="background:#a22;">
            Reset
        </button>

    </div>


    <script
        type="module"
        src="/script.js">
    </script>

</body>

</html>
