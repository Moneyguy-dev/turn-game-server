<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Choose a Side</title>

    <link
        rel="stylesheet"
        href="/styles.css"
    >

</head>


<body class="side-select-page">

    <main id="sideSelect">

        <h1>
            Choose Your Side
        </h1>


        <div class="sideSelectButtons">

            <button
                id="blueBtn"
                class="menuBtn sideChoiceBtn blueChoiceBtn"
                type="button"
            >
                Blue Forces
            </button>


            <button
                id="redBtn"
                class="menuBtn sideChoiceBtn redChoiceBtn"
                type="button"
            >
                Red Forces
            </button>


            <button
                id="adminBtn"
                class="menuBtn adminChoiceBtn"
                type="button"
            >
                Admin Control
            </button>

        </div>


        <p class="spectatorNotice">
            Spectators may view either side but cannot submit moves.
        </p>

    </main>


    <script>

        document
            .getElementById("blueBtn")
            .addEventListener("click", () => {

                window.location.href =
                    "blue.html?mode=blue";

            });


        document
            .getElementById("redBtn")
            .addEventListener("click", () => {

                window.location.href =
                    "red.html?mode=red";

            });


        document
            .getElementById("adminBtn")
            .addEventListener("click", () => {

                window.location.href =
                    "admin.html?mode=all";

            });

    </script>

</body>

</html>
